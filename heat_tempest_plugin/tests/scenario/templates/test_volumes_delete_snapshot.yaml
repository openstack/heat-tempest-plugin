heat_template_version: 2013-05-23

parameters:
  key_name:
    type: string
    description: keypair to enable SSH access to the instance.

  instance_type:
    type: string
    description: Type of the instance to be created.

  image_id:
    type: string
    description: ID of the image to use for the instance to be created.

  timeout:
    type: number
    description: Stack creation timeout

  dev_name:
    type: string
    description: Expected device name for volume
    default: vdb

  test_string:
    type: string
    description: Test string which is written to volume
    default: ateststring

  rescan_timeout:
    type: number
    description: Max number of seconds to wait for volume after rescan
    default: 240

  network:
    type: string

  volume_description:
    type: string
    description: Description of volume
    default: A volume description

  volume_size:
    type: number
    description: Size of volume
    default: 1

  wc_extra_args:
    type: string
    description: extra options to add to CURL command
    default: ""

resources:
  volume:
    deletion_policy: 'Snapshot'
    type: OS::Cinder::Volume
    properties:
      size: {get_param: volume_size}
      description: {get_param: volume_description}

  volume_attachment:
    type: OS::Cinder::VolumeAttachment
    properties:
      volume_id: { get_resource: volume }
      instance_uuid: { get_resource: instance }

  instance:
    type: OS::Nova::Server
    properties:
      image: { get_param: image_id }
      flavor: { get_param: instance_type }
      key_name: { get_param: key_name }
      networks:
      - uuid: {get_param: network}
      user_data_format: RAW
      user_data:
        str_replace:
          template: |
            #!/bin/sh
            # Trigger rescan to ensure we see the attached volume
            for i in /sys/class/scsi_host/*; do echo "- - -" > $i/scan; done
            # Wait for the rescan as the volume doesn't appear immediately
            for i in $(seq 1 rescan_timeout)
            do
              grep -q dev_name /proc/partitions && break
              sleep 1
            done
            if grep -q dev_name /proc/partitions
            then
              # The device can appear before the iSCSI path is ready for
              # I/O, so retry until the write and read-back succeed.
              for i in $(seq 1 rescan_timeout)
              do
                # A mount that succeeded in a previous iteration but whose
                # trailing umount failed leaves the filesystem mounted and
                # then every mkfs fails with "apparently in use by the
                # system"; lazily detach any stale mount before retrying.
                umount -l /mnt 2>/dev/null
                if mkfs.ext4 -F /dev/dev_name >/dev/null 2>/tmp/vol.err && \
                   mount /dev/dev_name /mnt 2>>/tmp/vol.err && \
                   echo "test_string" > /mnt/testfile 2>>/tmp/vol.err && \
                   [ "$(cat /mnt/testfile 2>>/tmp/vol.err)" = "test_string" ] && \
                   sync && umount /mnt 2>>/tmp/vol.err
                then
                  curl wc_extra_args -X PUT -H 'Content-Type:' --data-binary '{"Status": "SUCCESS", "Reason": "Test Complete", "Data": "Completed volume configuration.", "UniqueId": "instance1"}' "wc_url"
                  exit 0
                fi
                err=$(tail -1 /tmp/vol.err 2>/dev/null | tr -d '"\\' | cut -c 1-80)
                sleep 1
              done
              curl wc_extra_args -X PUT -H 'Content-Type:' --data-binary "{\"Status\": \"FAILURE\", \"Reason\": \"Device dev_name not ready for I/O, last error: $err\", \"Data\": \"Test Failed\", \"UniqueId\": \"instance1\"}" "wc_url"
            else
              curl wc_extra_args -X PUT -H 'Content-Type:' --data-binary '{"Status": "FAILURE", "Reason": "Device dev_name never appeared in the guest", "Data": "Test Failed", "UniqueId": "instance1"}' "wc_url"
            fi
          params:
            wc_url: { get_resource: wait_handle }
            dev_name: { get_param: dev_name }
            rescan_timeout: { get_param: rescan_timeout }
            test_string: { get_param: test_string }
            wc_extra_args: { get_param: wc_extra_args }

  wait_handle:
    type: OS::Heat::UpdateWaitConditionHandle

  wait_condition:
    type: OS::Heat::WaitCondition
    depends_on: instance
    properties:
      handle: { get_resource: wait_handle }
      timeout: { get_param: timeout }


outputs:
  status:
    description: status
    value: { get_attr: ['volume', 'status'] }

  size:
    description: size
    value: { get_attr: ['volume', 'size'] }

  display_description:
    description: display_description
    value: { get_attr: ['volume', 'display_description'] }

  volume_id:
    value: { get_resource: volume }
